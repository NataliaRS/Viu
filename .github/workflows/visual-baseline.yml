name: Visual baseline review (one-shot, manual)

# F5b · Genera MATERIAL DE REVISIÓN LADO A LADO para que la dueña apruebe una baseline DOM.
# Se dispara A MANO (workflow_dispatch). NO commitea nada. Produce dos PNG por entry:
#   - visual-baselines/*.png  = baseline DOM candidata (screenshot de la story, Chromium)
#   - visual-figma-refs/*.png = render del nodo Figma (Images API, con el secret) — solo referencia
# Natalia mira ambos lado a lado y decide si el vínculo Figma↔diseño está bien; si aprueba, la
# baseline DOM va en commit `baseline:` + skip:false. El gate mecánico (storybook-verify) es
# DOM-vs-DOM. NO se hace pixel-diff contra Figma (ver code-build: es ruido cross-rasterizer, ~15%
# medido en el POC jul-2026 con paridad métrica excelente).

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Filtrar por nombre de componente (vacío = todas las entries del manifest)"
        required: false
        default: "Badge"

permissions:
  contents: read

jobs:
  review-material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # capture-baselines.mjs resuelve `playwright` desde ui/ (1.56); el root tiene 1.61
      # (hoisted por test-runner). Instalamos con el binario de ui para el build correcto.
      - run: ./ui/node_modules/.bin/playwright install --with-deps chromium

      - name: Render de referencia del nodo Figma (ayuda de revisión, NO baseline)
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: node scripts/capture-figma-refs.mjs --only "${{ inputs.only }}"

      - name: Build tokens
        run: npm run build:tokens
      - name: Build Storybook
        run: npm run build-storybook -w ui

      - name: Baseline DOM candidata (screenshot de la story)
        run: node scripts/capture-baselines.mjs --storybook ui/storybook-static --only "${{ inputs.only }}"

      - name: Subir material de revisión lado a lado (story DOM + ref Figma)
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-review
          path: |
            visual-baselines/*.png
            visual-figma-refs/*.png
          if-no-files-found: warn
