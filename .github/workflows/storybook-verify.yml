name: Storybook verify (a11y + visual)

on:
  push:
    branches: ["claude/viu-design-system"]
    paths: ["ui/**", "tokens/**", "dist/**", "visual-baselines/**"]
  pull_request:
    paths: ["ui/**", "tokens/**", "dist/**", "visual-baselines/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Vitest: tests de componentes + GATE de i18n (i18n-coverage.test.tsx) — falla si un
      # componente con `parameters.viu` no tiene su traducción EN en .storybook/viu-en.ts.
      # Así la traducción de cada componente nuevo/editado es MECÁNICA, no "acordarse".
      - name: typecheck
        run: npm run typecheck -w ui
      - name: unit tests + i18n coverage gate
        run: npm run test -w ui

  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      # Monorepo npm workspaces: un solo lockfile en la raíz; `ui` es workspace sin
      # lockfile propio → se instala y buildea desde la raíz (mismo patrón que
      # deploy-storybook.yml). Los binarios se hoistean a node_modules/.bin.
      - run: npm ci
      # Resiliencia: el runner trae un source apt de google-chrome (a veces sirve un
      # Packages.gz desincronizado → Hash Sum mismatch → `apt-get update` de
      # `--with-deps` aborta con exit 100). Quitamos CUALQUIER source que lo referencie
      # (formato .list o deb822 .sources) y, si aun así `--with-deps` falla, caemos a
      # instalar solo el binario de Chromium (del CDN de Playwright; el runner ya trae
      # las libs del sistema) — inmune a repos apt de terceros rotos.
      - name: Install Chromium (resiliente a repos apt de terceros rotos)
        run: |
          sudo bash -c 'grep -rl dl.google.com /etc/apt/sources.list.d/ 2>/dev/null | xargs -r rm -f' || true
          npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Build tokens (dist/tokens.css consumido por preview)
        run: npm run build:tokens
      - name: Build Storybook
        run: npm run build-storybook -w ui
      - name: axe sobre todas las stories
        run: |
          npx http-server ui/storybook-static -p 6006 --silent &
          npx wait-on tcp:127.0.0.1:6006
          npx test-storybook --url http://127.0.0.1:6006 --config-dir ui/.storybook

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Resiliencia: el runner trae un source apt de google-chrome (a veces sirve un
      # Packages.gz desincronizado → Hash Sum mismatch → `apt-get update` de
      # `--with-deps` aborta con exit 100). Quitamos CUALQUIER source que lo referencie
      # (formato .list o deb822 .sources) y, si aun así `--with-deps` falla, caemos a
      # instalar solo el binario de Chromium (del CDN de Playwright; el runner ya trae
      # las libs del sistema) — inmune a repos apt de terceros rotos.
      - name: Install Chromium (resiliente a repos apt de terceros rotos)
        run: |
          sudo bash -c 'grep -rl dl.google.com /etc/apt/sources.list.d/ 2>/dev/null | xargs -r rm -f' || true
          npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Build tokens
        run: npm run build:tokens
      - name: Build Storybook
        run: npm run build-storybook -w ui
      - name: Regresión visual Figma ↔ stories
        run: node scripts/visual-regression.mjs --storybook ui/storybook-static
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: visual-diffs/
