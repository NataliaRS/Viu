name: Tokens parity

# Cadena de paridad de tokens: snapshot(Figma) ↔ tokens/*.json ↔ dist/*.css
#  - sync:tokens  → tokens/*.json espeja el último snapshot de Figma (scripts/figma-tokens.snapshot.json)
#  - check:tokens → dist/ es el build fiel de tokens/*.json (sin ediciones manuales al CSS)
# El snapshot lo refresca un agente vía MCP (Figma Pro no tiene la Variables REST API para CI headless).

on:
  push:
    paths:
      - "tokens/**"
      - "dist/**"
      - "scripts/build-tokens.mjs"
      - "scripts/check-tokens-parity.mjs"
      - "scripts/sync-tokens.mjs"
      - "scripts/figma-tokens.snapshot.json"
  pull_request:
    paths:
      - "tokens/**"
      - "dist/**"
      - "scripts/build-tokens.mjs"
      - "scripts/check-tokens-parity.mjs"
      - "scripts/sync-tokens.mjs"
      - "scripts/figma-tokens.snapshot.json"
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Figma↔repo (tokens/*.json espeja el snapshot de Figma)
        run: npm run sync:tokens
      - name: JSON↔CSS (dist/ es el build fiel de tokens/*.json)
        run: npm run check:tokens
